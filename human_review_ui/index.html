<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-DARI Human Review Desk</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="identity"><span class="mark">K</span><div><h1>K-DARI 검토대</h1><p>Phase 9 답변을 직접 읽고 근거를 확인합니다.</p></div></div>
    <div class="progress-block"><div><strong id="progressText">0 / 120</strong><span>검토 완료</span></div><div class="progress-track"><i id="progressBar"></i></div><span id="saveState" class="save-state">저장됨</span></div>
  </header>

  <nav class="toolbar" aria-label="답변 탐색">
    <button id="prevBtn" class="quiet">이전</button>
    <label class="search"><span>답변 ID</span><input id="idSearch" placeholder="R001" maxlength="4"></label>
    <button id="goBtn" class="quiet">이동</button>
    <button id="nextBtn">다음 답변</button>
    <label class="filter"><input type="checkbox" id="onlyUnreviewed"> 미평가만</label>
    <label class="filter"><input type="checkbox" id="onlyNeeds"> 추가 확인만</label>
    <div class="spacer"></div>
    <label class="reviewer"><span>검토자 ID</span><input id="reviewerId" autocomplete="off" placeholder="이니셜 또는 ID"></label>
    <button id="backupBtn" class="quiet">백업</button>
    <button id="restoreBtn" class="quiet">복원</button>
    <input type="file" id="restoreFile" accept="application/json" hidden>
    <a href="/api/export.json" class="button-link quiet">JSON</a>
    <a href="/api/export.csv" class="button-link quiet">CSV</a>
  </nav>

  <main class="desk">
    <section class="answer-pane" aria-labelledby="answerTitle">
      <div class="pane-head"><div><span id="blindId" class="blind-id">R001</span><h2 id="answerTitle">사용자 질문</h2></div><span id="verificationDate" class="date-chip"></span></div>
      <div id="integrityWarning" class="integrity-warning" hidden><strong>블라인드 주의</strong><span>원본 답변에 실험 조건을 추정할 수 있는 표현이 있습니다. 원본은 수정하지 않았습니다.</span></div>
      <blockquote id="question" class="question"></blockquote>
      <article id="answer" class="markdown-body"></article>
      <section class="sources"><h3>답변에 포함된 링크</h3><ol id="sourceLinks"></ol><p id="noSources">표시된 링크가 없습니다.</p></section>
    </section>

    <aside class="review-pane" aria-labelledby="reviewTitle">
      <div class="pane-head sticky-head"><div><span>Human review</span><h2 id="reviewTitle">평가 기록</h2></div><div id="totalScore" class="total-score"><strong>—</strong><span>/ 100</span></div></div>
      <section id="scoreFields" class="score-fields"></section>
      <section class="claims-section">
        <div class="section-title"><div><h3>핵심 주장 검증</h3><p>공식 원문의 위치와 판정을 직접 기록합니다.</p></div><button id="addClaimBtn" class="quiet">주장 추가</button></div>
        <div id="claims"></div>
      </section>
      <section class="notes-grid">
        <label><span>장점</span><textarea id="strengths"></textarea></label>
        <label><span>오류</span><textarea id="errors"></textarea></label>
        <label><span>누락</span><textarea id="omissions"></textarea></label>
        <label><span>개선점</span><textarea id="improvements"></textarea></label>
        <label class="wide"><span>종합 의견</span><textarea id="overallComment"></textarea></label>
      </section>
      <footer class="review-actions">
        <button data-status="DRAFT" class="quiet status-btn">임시 저장</button>
        <button data-status="NEEDS_VERIFICATION" class="needs status-btn">추가 확인 필요</button>
        <button data-status="COMPLETED" class="complete status-btn">검토 완료</button>
        <button id="saveNextBtn">저장 후 다음 답변</button>
      </footer>
    </aside>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
